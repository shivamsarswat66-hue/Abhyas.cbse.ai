name: Build Android APK

on:
  push:
    branches:
      - arena/332bb2b4-abhyas-cbse-ai
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install and build web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK (download from Actions → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Abhyas-CBSE
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK on GitHub Release
        if: github.ref == 'refs/heads/arena/332bb2b4-abhyas-cbse-ai' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Abhyas CBSE APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
